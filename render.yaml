services:
  - type: web
    name: familyplate-nutrition-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run db:init
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-children
          property: connectionString
